<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the hidden city - Travis Sanderson Photography</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Project page specific styles */
        .project-header {
            padding: 6rem 5% 2rem;
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 60px;
        }
        
        .project-header h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }
        
        .project-header p {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.8;
            max-width: 800px;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #666;
            text-decoration: none;
            font-size: 1rem;
            transition: color 0.3s;
        }
        
        .back-link:hover {
            color: #333;
        }
        
        /* Project gallery styles */
        .project-gallery {
            padding: 2rem 5% 4rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .project-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }
        
        .project-gallery-item {
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 3/2;
        }
        
        .project-gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .project-gallery-item:hover img {
            transform: scale(1.05);
        }
        
        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .lightbox-close:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Travis Sanderson</h1>
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="index.html#gallery">gallery</a></li>
                <li><a href="projects.html">projects</a></li>
                <li><a href="index.html#about">about</a></li>
                <li><a href="index.html#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="project-header">
        <a href="projects.html" class="back-link">← back to projects</a>
        <h1>the hidden city</h1>
        <p>exploring the unseen corners of urban life</p>
    </section>

    <section class="project-gallery">
        <div class="project-gallery-grid">
            <!-- Image 1 -->
            <div class="project-gallery-item" onclick="openLightbox('hidden-city-01.jpg')">
                <img src="hidden-city-01.jpg" alt="the hidden city 1">

            <!-- Image 5 -->
            <div class="project-gallery-item" onclick="openLightbox('hidden-city-05.jpg')">
                <img src="hidden-city-05.jpg" alt="the hidden city 5">
            </div>
            
            <!-- Image 6 -->
            <div class="project-gallery-item" onclick="openLightbox('hidden-city-06.jpg')">
                <img src="hidden-city-06.jpg" alt="the hidden city 6">
            </div>
            
            <!-- Image 7 -->
            <div class="project-gallery-item" onclick="openLightbox('hidden-city-07.jpg')">

    <footer>
        <p>&copy; dyingtrees 2026. All rights reserved.</p>
    </footer>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightbox-img" src="" alt="Full size image">
    </div>

    <script>
        // Lightbox functionality
        function openLightbox(imageSrc) {
            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox-img').src = imageSrc;
            document.body.style.overflow = 'hidden';
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        
        // Close lightbox with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
