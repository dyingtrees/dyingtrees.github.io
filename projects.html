<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Travis Sanderson Photography</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Projects page specific styles */
        .projects-section {
            padding: 4rem 5%;
            max-width: 1200px;
            margin: 0 auto;
            margin-top: 60px;
        }
        
        .projects-section h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 3rem;
            letter-spacing: 2px;
            text-align: left;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 400px));
            gap: 3rem;
        }
        
        .project-card {
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s ease;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
        }
        
        .project-thumbnail {
            width: 100%;
            aspect-ratio: 3/2;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        .project-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .project-card:hover .project-thumbnail img {
            transform: scale(1.05);
        }
        
        .project-info h2 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }
        
        .project-info p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Travis Sanderson</h1>
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="index.html#gallery">gallery</a></li>
                <li><a href="projects.html">projects</a></li>
                <li><a href="index.html#about">about</a></li>
                <li><a href="index.html#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="projects-section">
        <h1>projects</h1>
        
        <div class="projects-grid">
            <!-- Project 1: The Hidden City -->
            <a href="project-between-the-streets.html" class="project-card">
                <div class="project-thumbnail">
                    <img src="project-hidden-city-thumb.jpg" alt="between the streets">
                </div>
                <div class="project-info">
                    <h2>between the streets</h2>
                    <p>the city as it was not meant to be seen</p>
                </div>
            </a>
            
            <!-- Placeholder for future projects -->
            <!-- You can add more projects here later following the same pattern -->
        </div>
    </section>

    <footer>
        <p>&copy; dyingtrees 2026. All rights reserved.</p>
    </footer>
     <script>
        // Disable right-click on images
        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                return false;
            }
        });
        
        // Disable dragging images
        document.addEventListener('dragstart', function(e) {
            if (e.target.tagName === 'IMG') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
