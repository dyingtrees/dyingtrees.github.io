<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travis Sanderson Photography</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Lightbox styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .lightbox-close:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Travis Sanderson</h1>
            <ul>
                <li><a href="#gallery">gallery</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h2></h2>
            <p>I like to observe<br>
               Looking at life around me.<br>
               So I photograph.</p>
        </div>
    </section>

    <section id="gallery" class="gallery">
        <h2>gallery</h2>
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_01.jpg')">
                <img src="sanderson_travis_01.jpg" alt="Photo 1">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_02.jpg')">
                <img src="sanderson_travis_02.jpg" alt="Photo 2">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_03.jpg')">
                <img src="sanderson_travis_03.jpg" alt="Photo 3">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_04.jpg')">
                <img src="sanderson_travis_04.jpg" alt="Photo 4">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_05.jpg')">
                <img src="sanderson_travis_05.jpg" alt="Photo 5">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_08.jpg')">
                <img src="sanderson_travis_08.jpg" alt="Photo 6">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_12.jpg')">
                <img src="sanderson_travis_12.jpg" alt="Photo 7">
            </div>
            <div class="gallery-item" onclick="openLightbox('20241026_017.jpg')">
                <img src="20241026_017.jpg" alt="Photo 8">
            </div>
            <div class="gallery-item" onclick="openLightbox('20250710_108.jpg')">
                <img src="20250710_108.jpg" alt="Photo 9">
            </div>
            <div class="gallery-item" onclick="openLightbox('20250726_106.jpg')">
                <img src="20250726_106.jpg" alt="Photo 10">
            </div>
            <div class="gallery-item" onclick="openLightbox('20250625_126_v1.jpg')">
                <img src="20250625_126_v1.jpg" alt="Photo 11">
            </div>
            <div class="gallery-item" onclick="openLightbox('sanderson_travis_10.jpg')">
                <img src="sanderson_travis_10.jpg" alt="Photo 12">
            </div>            
        </div>
    </section>

    <section id="about" class="about">
        <h2>about</h2>
        <div class="about-content">
            <p>Based in Montréal</p>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>contact</h2>
        <div class="contact-content">
            <p>Email: travissandersonmail@gmail.com</p>
            <p>Instagram: <a href="https://www.instagram.com/2roues4saisons/" target="_blank">@2roues4saisons</a></p>
        </div>
    </section>

    <footer>
        <p>&copy; Travis Sanderson 2026. All rights reserved.</p>
    </footer>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightbox-img" src="" alt="Full size image">
    </div>

    <script>
        function openLightbox(imageSrc) {
            document.getElementById('lightbox').classList.add('active');
            document.getElementById('lightbox-img').src = imageSrc;
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }
        
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto'; // Re-enable scrolling
        }
        
        // Close lightbox with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
